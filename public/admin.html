<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>Admin | FCMS Library</title>
<style>
*{box-sizing:border-box;margin:0;font-family:system-ui,-apple-system,sans-serif}
[hidden]{display:none!important}
body{background:#fff;color:#1F2937;padding:24px 16px}
main{max-width:380px;margin:40px auto}
h1{color:#002F68;font-size:22px}
.sub{color:#6B7280;font-size:14px;margin:4px 0 20px}
label{display:block;font-size:14px;font-weight:500;color:#002F68;margin-bottom:4px}
input{width:100%;padding:10px;border:1px solid #E5E7EB;border-radius:8px;font-size:16px;margin-bottom:14px}
button{width:100%;padding:12px;border:none;border-radius:8px;background:#04CEFF;color:#002F68;font-weight:600;font-size:15px;cursor:pointer}
button.alt{background:#EEF4FC}
#msg{color:#D61F1F;font-size:14px;margin-top:12px}
.cf-turnstile{margin-bottom:14px}
</style>
</head>
<body>
<main>
<h1>FCMS Library</h1>
<form id="login">
<p class="sub">Admin sign in</p>
<label for="email">Email</label>
<input id="email" type="email" autocomplete="username" required>
<label for="password">Password</label>
<input id="password" type="password" autocomplete="current-password" required>
<div class="cf-turnstile" data-sitekey="0x4AAAAAAFmTpXkVyoEUblnG"></div>
<button type="submit">Sign in</button>
</form>
<div id="panel" hidden>
<p class="sub">Signed in as</p>
<p id="who" style="margin-bottom:20px;font-weight:600"></p>
<button id="logout" class="alt" type="button">Sign out</button>
</div>
<p id="msg"></p>
</main>
<script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>
<script src="/admin.js"></script>
</body>
</html>
